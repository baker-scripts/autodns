name: Docker Image CI

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*.*.*'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker image
        run: |
          TAG="ghcr.io/${{ github.repository_owner }}/autodns"
          if [[ "${{ github.ref_name }}" == "main" ]]; then
            IMAGE_TAG="latest"
          elif [[ "${{ github.ref_name }}" == "develop" ]]; then
            IMAGE_TAG="develop"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            IMAGE_TAG="${{ github.ref_name }}"
          fi
          FULL_TAG="${TAG}:${IMAGE_TAG}"
          echo "Building and pushing Docker image with tag $FULL_TAG"
          docker build . --file DOCKERFILE --tag "$FULL_TAG"
          docker push "$FULL_TAG"
