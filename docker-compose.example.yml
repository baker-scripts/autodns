services:
  autodns:
    image: ghcr.io/baker-scripts/autodns:develop@sha256:b567ef99a460cfe1b19d213e0a44f062abfc73f3397c8d919cbd19eb7f8285d8
    ports:
      - "4295:4295"
    volumes:
      - "/your/path/to/config:/config"
    environment:
      - "CF_ZONE_ID=your-zone-id"
      - "CF_API_TOKEN=your-api-token"
      - "APPRISE_URLS=your-apprise-urls-separated-by-commas"
      - "AUTODNS_PORT=4295"
      - "AUTODNS_HOST=0.0.0.0"
      - "TRUSTED_PROXIES="
    restart: unless-stopped
