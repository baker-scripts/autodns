services:
  autodns:
    image: ghcr.io/baker-scripts/autodns:develop@sha256:53a4878fb3336a2cca03e1f3bca1cbae4063a6743eb94e5d0e8ebd2e96c15cd3
    ports:
      - "4295:4295"
    volumes:
      - "/your/path/to/config:/config"
    environment:
      - "CF_ZONE_ID=your-zone-id"
      - "CF_API_TOKEN=your-api-token"
      - "APPRISE_URLS=your-apprise-urls-separated-by-commas"
      - "AUTODNS_PORT=4295"
      - "AUTODNS_HOST=0.0.0.0"
      - "TRUSTED_PROXIES="
    restart: unless-stopped
